
services:
  api:
    build: .
    container_name: paylink_api
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    container_name: paylink_db
    environment:
      POSTGRES_USER: paylink
      POSTGRES_PASSWORD: paylink123
      POSTGRES_DB: paylink_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paylink -d paylink_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
